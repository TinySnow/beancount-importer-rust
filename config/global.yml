# 通用全局配置（不包含个人账户信息）
default:
  currency: CNY
  expense_account: Expenses:Unknown
  asset_account: Assets:Unknown
  income_account: Income:Unknown

# 可选：全局规则（默认留空，避免误判）
global_rules: []

output:
  date_format: "%Y-%m-%d"
  decimal_places: 2

# 可选：在一个文件中集中维护各 provider 默认配置。
# 如果你使用 --config 指定了单独 provider 文件，则以 provider 文件为准。
providers:
  alipay:
    name: "支付宝"
    mapping_file: "mapping/third_party/alipay.yml"
    default:
      asset_account: "Assets:Wallet:Alipay:Balance"
      expense_account: "Expenses:Unknown"
      income_account: "Income:Unknown"
      currency: "CNY"
    tabular_options:
      delimiter: ","
      flexible: true
      encoding: "auto"
    skip_header_lines: 24
    has_header_row: true

  wechat:
    name: "微信"
    mapping_file: "mapping/third_party/wechat.yml"
    default:
      asset_account: "Assets:Wallet:WeChat:Balance"
      expense_account: "Expenses:Unknown"
      income_account: "Income:Unknown"
      currency: "CNY"
    tabular_options:
      delimiter: ","
      flexible: true
      encoding: "auto"
    skip_header_lines: 17
    has_header_row: true

  jd:
    name: "京东"
    mapping_file: "mapping/third_party/jd.yml"
    default:
      asset_account: "Assets:Wallet:JD:Balance"
      expense_account: "Expenses:Unknown"
      income_account: "Income:Unknown"
      currency: "CNY"
    tabular_options:
      delimiter: ","
      flexible: true
      encoding: "auto"
    skip_header_lines: 21
    has_header_row: true

  mt:
    name: "美团"
    mapping_file: "mapping/third_party/mt.yml"
    default:
      asset_account: "Assets:Wallet:Meituan:Balance"
      expense_account: "Expenses:Unknown"
      income_account: "Income:Unknown"
      currency: "CNY"
    tabular_options:
      delimiter: ","
      flexible: true
      encoding: "auto"
    skip_header_lines: 19
    has_header_row: true

  icbc:
    name: "工商银行"
    mapping_file: "mapping/banks/icbc.yml"
    default:
      asset_account: "Assets:Bank:ICBC:Checking"
      expense_account: "Expenses:Unknown"
      income_account: "Income:Unknown"
      currency: "CNY"
    tabular_options:
      delimiter: ","
      flexible: true
      encoding: "auto"
    skip_header_lines: 6
    has_header_row: true

  ccb:
    name: "建设银行"
    mapping_file: "mapping/banks/ccb.yml"
    default:
      asset_account: "Assets:Bank:CCB:Checking"
      expense_account: "Expenses:Unknown"
      income_account: "Income:Unknown"
      currency: "CNY"
    tabular_options:
      delimiter: ","
      flexible: true
      encoding: "auto"
    skip_header_lines: 0
    has_header_row: true

  dzccb:
    name: "达州银行"
    mapping_file: "mapping/banks/dzccb.yml"
    default:
      asset_account: "Assets:Bank:DZCCB:Checking"
      expense_account: "Expenses:Unknown"
      income_account: "Income:Unknown"
      currency: "CNY"
    tabular_options:
      delimiter: ","
      flexible: true
      encoding: "auto"
    skip_header_lines: 0
    has_header_row: true

  futu:
    name: "富途"
    mapping_file: "mapping/securities/futu.yml"
    default:
      asset_account: "Assets:Broker:Futu:Securities"
      expense_account: "Expenses:Investing:Fees"
      income_account: "Income:Investing:Capital-Gains"
      currency: "USD"
    securities_accounts:
      cash_account: "Assets:Broker:Futu:Cash"
      fee_account: "Expenses:Broker:Futu:Fee"
      pnl_account: "Income:Broker:Futu:PnL"
      rounding_account: "Expenses:Broker:Futu:Rounding"
      repo_interest_account: "Income:Investing:Interest"
    tabular_options:
      delimiter: ","
      quote: "\""
      flexible: true
      encoding: "auto"
    skip_header_lines: 0
    has_header_row: true
    output:
      date_format: "%Y-%m-%d"
      decimal_places: 4
      booking_method: "FIFO"

  yinhe:
    name: "银河证券"
    mapping_file: "mapping/securities/yinhe.yml"
    default:
      asset_account: "Assets:Broker:Galaxy:Securities"
      expense_account: "Expenses:Investing:Fees"
      income_account: "Income:Investing:Capital-Gains"
      currency: "CNY"
    securities_accounts:
      cash_account: "Assets:Broker:Galaxy:Cash"
      fee_account: "Expenses:Broker:Galaxy:Fee"
      pnl_account: "Income:Broker:Galaxy:PnL"
      rounding_account: "Expenses:Broker:Galaxy:Rounding"
      repo_interest_account: "Income:Investing:Interest"
    tabular_options:
      delimiter: "\t"
      flexible: true
      encoding: "GBK"
    skip_header_lines: 0
    has_header_row: true
    output:
      date_format: "%Y-%m-%d"
      decimal_places: 4
      booking_method: "FIFO"
      emit_open_directives: true



