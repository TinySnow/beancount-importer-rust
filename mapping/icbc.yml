# 工商银行字段映射（网银明细下载）
# 典型表头：
# 交易日期, 摘要, 交易详情, 交易场所, ...,
# 交易金额(收入), 交易金额(支出), 交易币种,
# 记账金额(收入), 记账金额(支出), 记账币种, 余额, 对方户名, 对方账户

date: "交易日期"
payee: "对方户名"
narration: "交易场所"
currency: "记账币种"
reference: "对方账户"

date_formats:
  - "%Y-%m-%d"
  - "%Y/%m/%d"

extra_fields:
  txType: "摘要"
  note: "交易详情"
  peer: "对方户名"
  peerAccount: "对方账户"
  country: "交易国家或地区简称"
  incomeAmount: "记账金额(收入)"
  expenseAmount: "记账金额(支出)"
  balance: "余额"
  payTime: "交易日期"
