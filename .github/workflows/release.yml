name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  APP_NAME: beancount-importer-rust
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_ext: ".exe"
          - os: macos-13
            target: x86_64-apple-darwin
            binary_ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            binary_ext: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          BINARY_EXT: ${{ matrix.binary_ext }}
        run: |
          set -Eeuo pipefail
          TAG="${GITHUB_REF_NAME}"
          BUNDLE="${APP_NAME}-${TAG}-${TARGET}"
          mkdir -p "dist/${BUNDLE}"

          cp "target/${TARGET}/release/${APP_NAME}${BINARY_EXT}" "dist/${BUNDLE}/"
          cp README.md LICENSE "dist/${BUNDLE}/"
          cp -R config mapping "dist/${BUNDLE}/"

          tar -C dist -czf "dist/${BUNDLE}.tar.gz" "${BUNDLE}"

      - name: Package archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $tag = $env:GITHUB_REF_NAME
          $bundle = "$env:APP_NAME-$tag-$target"

          New-Item -ItemType Directory -Force -Path "dist/$bundle" | Out-Null
          Copy-Item "target/$target/release/$env:APP_NAME.exe" "dist/$bundle/"
          Copy-Item README.md, LICENSE "dist/$bundle/"
          Copy-Item config -Destination "dist/$bundle/config" -Recurse
          Copy-Item mapping -Destination "dist/$bundle/mapping" -Recurse

          Compress-Archive -Path "dist/$bundle/*" -DestinationPath "dist/$bundle.zip"

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -Eeuo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
